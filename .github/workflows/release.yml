name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  DOCKERHUB_REPO: xtravisions/one-router

# Least privilege by default; only the release job may write.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tag in the trailing comment);
# a moved tag cannot change what runs with our secrets.
jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require release signing configuration
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_PUBLIC_KEY" ]; then
            echo "::error::Repository variable RELEASE_PUBLIC_KEY is not set (see scripts/release-keygen.sh)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Build admin UI
        working-directory: admin-ui
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        # Pinned release (v0.2.5) instead of the repository HEAD.
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2 --locked

      - name: Build release binary
        env:
          # Embedded so self-update can verify release signatures.
          ONE_ROUTER_RELEASE_PUBKEY: ${{ vars.RELEASE_PUBLIC_KEY }}
          TARGET: ${{ matrix.target }}
        run: cross build --release --target "$TARGET"

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/one-router" dist/
          cd dist
          tar czf "../one-router-$TARGET.tar.gz" one-router

      - name: Generate checksum
        env:
          TARGET: ${{ matrix.target }}
        run: sha256sum "one-router-$TARGET.tar.gz" > "one-router-$TARGET.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.arch }}
          path: |
            one-router-${{ matrix.target }}.tar.gz
            one-router-${{ matrix.target }}.tar.gz.sha256

  # Signing is isolated: the private key is only present in this job, which
  # runs no third-party build tooling.
  sign:
    name: Sign checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::Secret RELEASE_SIGNING_KEY is not set (see scripts/release-keygen.sh)"
            exit 1
          fi
          umask 077
          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY"
          # The key must match the public key embedded in the binaries.
          ACTUAL="$(openssl pkey -in "$KEY" -pubout -outform DER | base64 | tr -d '\n')"
          if [ "$ACTUAL" != "$RELEASE_PUBLIC_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY does not match RELEASE_PUBLIC_KEY"
            exit 1
          fi
          for f in artifacts/*/*.sha256; do
            openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$f" -out "$f.sig"
            openssl pkeyutl -verify -pubin -inkey <(openssl pkey -in "$KEY" -pubout) -rawin -in "$f" -sigfile "$f.sig"
          done

      - name: Upload signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: artifacts/*/*.sig

  docker:
    name: Docker images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download amd64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binary-amd64
          path: artifacts/

      - name: Download arm64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binary-arm64
          path: artifacts/

      - name: Extract binaries
        run: |
          mkdir -p binaries/amd64 binaries/arm64
          tar xzf artifacts/one-router-x86_64-unknown-linux-gnu.tar.gz -C binaries/amd64/
          tar xzf artifacts/one-router-aarch64-unknown-linux-gnu.tar.gz -C binaries/arm64/

      - name: Extract version tag
        id: version
        # The tag name is untrusted text: pass it through env, never inline it
        # into a script.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            v[0-9]*) ;;
            *) echo "::error::unexpected tag name"; exit 1 ;;
          esac
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "::error::tag name contains unexpected characters"; exit 1
          fi
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push per-platform images, then create manifests
      - name: Build and push amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.prebuilt
          platforms: linux/amd64
          build-args: BINARY_PATH=binaries/amd64/one-router
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ steps.version.outputs.tag }}-amd64

      - name: Build and push arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.prebuilt
          platforms: linux/arm64
          build-args: BINARY_PATH=binaries/arm64/one-router
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ steps.version.outputs.tag }}-arm64

      - name: Create and push multi-arch manifests
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker buildx imagetools create -t "$DOCKERHUB_REPO:$TAG" \
            "$DOCKERHUB_REPO:$TAG-amd64" \
            "$DOCKERHUB_REPO:$TAG-arm64"
          docker buildx imagetools create -t "$DOCKERHUB_REPO:latest" \
            "$DOCKERHUB_REPO:$TAG-amd64" \
            "$DOCKERHUB_REPO:$TAG-arm64"

  release:
    name: GitHub Release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/binary-amd64/*.tar.gz
            artifacts/binary-amd64/*.sha256
            artifacts/binary-arm64/*.tar.gz
            artifacts/binary-arm64/*.sha256
            artifacts/signatures/**/*.sig
